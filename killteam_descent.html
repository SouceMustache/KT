<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KT Descent">
<link rel="icon" type="image/png" sizes="32x32" href="descent-favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="descent-favicon-16.png">
<link rel="apple-touch-icon" href="descent-apple-touch-icon.png">
<link rel="manifest" href="manifest-descent.json">
<meta name="theme-color" content="#0d1013">
<title>Kill Team — Descent</title>
<style>
  /* Design language inherited from Field Planner: same dark token system, mono/sans
     pairing and orange accent, so the three apps read as one suite. The one thing
     unique to Descent is the two-board stack — that gets the signature treatment
     (upper/lower plates with a labelled gutter between them). */
  :root{--dock:60px;
    --bg:#0d1013; --board:#12171c; --panel:#161c23; --panel2:#1e262f;
    --line:#2a333d; --ink:#e7edf3; --muted:#8593a1; --dim:#5a6672;
    --red:#e5484d; --teal:#2bb8b8; --orange:#f2a03d;
    --npo:#c05a2b;                 /* NPOs get their own hue, distinct from both players */
    --upper:#6ea0c8; --lower:#c8a06e;  /* board-identity tints: sky vs tomb */
    --inj:#ff5a4d; --aplup:#4fd18b; --apldn:#5aa8ff; --elev:#c3ccd6;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);
    position:fixed;inset:0;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;-webkit-user-drag:none;}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;}

  #bar{display:flex;flex-direction:column;gap:7px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));
       background:var(--panel);border-bottom:1px solid var(--line);z-index:20;}
  .barrow{display:flex;align-items:center;gap:6px;}
  .barrow .spacer{flex:1 1 auto;min-width:0;}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel2);}
  .seg .tool{border:0;border-radius:0;background:transparent;padding:7px 11px;
    display:inline-flex;align-items:center;justify-content:center;color:var(--ink);}
  .seg .tool svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round;}
  .seg .tool+.tool{border-left:1px solid var(--line);}
  .seg .tool.on{background:rgba(242,160,61,.14);color:var(--orange);}
  .tool,.mini{border:1px solid var(--line);background:var(--panel2);color:var(--ink);
        font:inherit;font-size:12px;padding:8px 11px;border-radius:8px;cursor:pointer;
        display:inline-flex;align-items:center;gap:6px;user-select:none;-webkit-appearance:none;}
  .tool.on,.mini.on{border-color:var(--orange);color:var(--orange);background:rgba(242,160,61,.12);}
  .tool:active,.mini:active{transform:translateY(1px);}
  .iconbtn{width:30px;height:30px;flex:0 0 auto;display:grid;place-items:center;padding:0;border-radius:8px;
    border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;-webkit-appearance:none;}
  .iconbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
  .iconbtn:active{transform:translateY(1px);}
  .iconbtn.on{color:var(--orange);border-color:var(--orange);background:rgba(242,160,61,.12);}
  .brand{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;}
  .brand b{color:var(--orange);font-weight:600;}
  .packtag{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.05em;
    max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  #stage{flex:1 1 auto;position:relative;overflow:hidden;background:var(--bg);}
  #svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}

  /* board plates */
  .plate{fill:var(--board);stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke;}
  .kzlabel{fill:var(--dim);font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;}
  .gutter{fill:rgba(255,255,255,.015);}
  .gutlink{stroke:var(--orange);stroke-width:1.4;stroke-dasharray:5 5;vector-effect:non-scaling-stroke;opacity:.5;}

  /* HUD readout, bottom-left, mono like the Planner */
  #hud{position:absolute;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));
    font-family:var(--mono);font-size:11px;color:var(--muted);pointer-events:none;
    background:rgba(13,16,19,.72);border:1px solid var(--line);border-radius:8px;padding:6px 9px;line-height:1.5;
    backdrop-filter:blur(6px);max-width:60vw;}
  #hud b{color:var(--ink);font-weight:600;}
  #hud .k{color:var(--dim);}

  /* pack picker — the first screen */
  #picker{position:fixed;inset:0;z-index:60;background:var(--bg);
    display:flex;flex-direction:column;padding:0;overflow:hidden;}
  #picker .phead{padding:calc(22px + env(safe-area-inset-top)) 22px 18px;border-bottom:1px solid var(--line);}
  #picker .peyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--npo);text-transform:uppercase;}
  #picker h1{margin:.35em 0 0;font-size:26px;letter-spacing:.01em;font-weight:650;}
  #picker .psub{color:var(--muted);font-size:13px;margin-top:6px;line-height:1.5;max-width:34em;}
  #packlist{flex:1 1 auto;overflow:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch;}
  .pack{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:15px 16px;cursor:pointer;
    transition:border-color .12s,transform .05s;}
  .pack:active{transform:translateY(1px);}
  .pack.sel{border-color:var(--orange);background:rgba(242,160,61,.06);}
  .pack .prow{display:flex;align-items:baseline;gap:10px;}
  .pack .pname{font-size:16px;font-weight:600;}
  .pack .pkind{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);}
  .pack .pkind.pve{color:var(--teal);border-color:rgba(43,184,184,.4);}
  .pack .pkind.pvp{color:var(--red);border-color:rgba(229,72,77,.4);}
  .pack .pkind.solo{color:var(--orange);border-color:rgba(242,160,61,.4);}
  .pack .pdesc{color:var(--muted);font-size:12.5px;margin-top:7px;line-height:1.5;}
  .pack .pmeta{display:flex;gap:14px;margin-top:11px;flex-wrap:wrap;}
  .pack .pmeta span{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.04em;}
  .pack .pmeta b{color:var(--muted);font-weight:600;}
  .boardchip{display:inline-flex;align-items:center;gap:5px;}
  .boardchip i{width:8px;height:8px;border-radius:2px;display:inline-block;}
  .boardchip.up i{background:var(--upper);} .boardchip.lo i{background:var(--lower);}
  #picker .pfoot{padding:14px 16px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
    display:flex;gap:10px;align-items:center;background:var(--panel);}
  #picker .pfoot .mini{flex:0 0 auto;}
  #startBtn{flex:1 1 auto;justify-content:center;padding:12px;border-color:var(--orange);color:var(--orange);
    background:rgba(242,160,61,.1);font-size:14px;font-weight:600;}
  #startBtn[disabled]{opacity:.4;pointer-events:none;}
  .hidden{display:none!important;}

  /* sticky note for blocked/invalid actions */
  #note{position:absolute;left:10px;right:10px;bottom:calc(52px + env(safe-area-inset-bottom));
    display:flex;align-items:flex-start;gap:10px;z-index:15;
    background:rgba(30,38,47,.96);border:1px solid var(--orange);border-radius:10px;
    padding:11px 12px;font-size:13px;line-height:1.45;color:var(--ink);
    box-shadow:0 8px 24px rgba(0,0,0,.4);backdrop-filter:blur(8px);}
  #note.good{border-color:var(--teal);}
  #note #noteText{flex:1 1 auto;}
  #note #noteX{flex:0 0 auto;border:0;background:transparent;color:var(--muted);
    font-size:15px;line-height:1;padding:2px 4px;cursor:pointer;}

  /* traverse mode: a hint chip in the toolbar */
  .modechip{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--orange);
    border:1px solid var(--orange);border-radius:999px;padding:4px 9px;background:rgba(242,160,61,.1);}

  /* submenu for the marker tool (Entryway / Teleport) */
  .subseg{display:inline-flex;gap:6px;align-items:center;}
  .subseg .mini{padding:6px 9px;font-size:11px;}
  .subseg .mini.on{border-color:var(--orange);color:var(--orange);background:rgba(242,160,61,.12);}

  /* operative editor sheet, slides up from the bottom */
  #opSheet{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));
    z-index:16;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:12px;box-shadow:0 -6px 28px rgba(0,0,0,.45);}
  .oshead{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
  #opLabel{width:84px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    color:var(--ink);font:inherit;font-family:var(--mono);font-size:14px;padding:7px 9px;text-transform:uppercase;}
  .oshead .spacer{flex:1 1 auto;}
  #opDelete{border-color:rgba(229,72,77,.4);color:var(--red);}
  .osrow{display:flex;align-items:center;gap:10px;padding:5px 0;}
  .osrow>label{width:66px;flex:0 0 auto;font-size:11px;color:var(--muted);
    font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;}
  .pick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .pick .mini{padding:6px 10px;font-size:12px;}
  .pick .mini.on{border-color:var(--orange);color:var(--orange);background:rgba(242,160,61,.12);}
  #opKw .mini.on{border-color:var(--teal);color:var(--teal);background:rgba(43,184,184,.12);}
  .osval{font-family:var(--mono);font-size:14px;min-width:34px;text-align:center;color:var(--ink);}
  .oshint{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-left:4px;}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <div class="barrow">
      <span class="brand">KT&nbsp;<b>Descent</b></span>
      <span class="spacer"></span>
      <div class="seg" id="toolseg">
        <button class="tool on" data-mode="move" title="Move" aria-label="Move"><svg viewBox="0 0 20 20"><path d="M10 3.2c2.4 0 4 1.6 4 4 0 1.6-.5 2.8-1 3.7-.4.8-.6 1.5-.6 2.3 0 .4.1.9.1 1.3 0 1.6-1 2.4-2.5 2.4s-2.5-.8-2.5-2.4c0-.4.1-.9.1-1.3 0-.8-.2-1.5-.6-2.3-.5-.9-1-2.1-1-3.7 0-2.4 1.6-4 4-4z"/></svg></button>
        <button class="tool" data-mode="measure" title="Line" aria-label="Line"><svg viewBox="0 0 20 20"><path d="M3.5 16.5 16.5 3.5"/><path d="M3.5 13.4v3.1h3.1M16.5 6.6V3.5h-3.1"/></svg></button>
        <button class="tool" data-mode="marker" title="Portals" aria-label="Portals"><svg viewBox="0 0 20 20"><path d="M10 3l3 3-3 3-3-3z"/><path d="M10 11l3 3-3 3-3-3z"/><path d="M10 6.2v4.6"/></svg></button>
        <button class="tool" data-mode="op" title="Add operative" aria-label="Add operative"><svg viewBox="0 0 20 20"><circle cx="10" cy="7.5" r="3.2"/><path d="M4.5 16.5c0-3 2.5-4.8 5.5-4.8s5.5 1.8 5.5 4.8"/></svg></button>
      </div>
      <button class="iconbtn" id="fitBtn" title="Reset view"><svg viewBox="0 0 20 20"><path d="M3 7V3h4M17 7V3h-4M3 13v4h4M17 13v4h-4"/></svg></button>
      <button class="iconbtn" id="packBtn" title="Change pack"><svg viewBox="0 0 20 20"><path d="M3 6l7-3 7 3-7 3-7-3z"/><path d="M3 10l7 3 7-3M3 14l7 3 7-3"/></svg></button>
    </div>
    <div class="barrow" id="ctxrow">
      <span class="packtag" id="packTag">No pack loaded</span>
      <span class="spacer"></span>
      <!-- marker submenu, shown only while the Portals tool is active -->
      <span class="subseg hidden" id="markerSub">
        <button class="mini" id="addEntry">＋ Entryway</button>
        <button class="mini" id="addTele">＋ Teleport</button>
      </span>
      <!-- op side picker, shown only while the Add-operative tool is active. Tap the board
           to drop an op of the chosen side; tap an existing op (in Move) to edit it. -->
      <span class="subseg hidden" id="opSub">
        <button class="mini on" data-side="mine">Mine</button>
        <button class="mini" data-side="enemy">Enemy</button>
        <button class="mini" data-side="npo">NPO</button>
      </span>
      <!-- traverse hint, shown when an op is selected on a stack pack -->
      <span class="modechip hidden" id="traverseChip">Tap a portal to climb</span>
    </div>
  </div>

  <div id="stage">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="hud"></div>
    <!-- Sticky note: blocked/invalid actions show here as a clickable message rather than
         a silent no-op or a greyed-out control (Daniel's UI preference). Tap to dismiss. -->
    <div id="note" class="hidden"><span id="noteText"></span><button id="noteX" aria-label="Dismiss">✕</button></div>

    <!-- Lightweight operative editor. A working stand-in for the full collapsible datacard
         (that arrives with packs in Phase 3); enough to place, retag and delete ops and to
         set the fields the portal engine reads: side, base, move, and FLY (crossing ban). -->
    <div id="opSheet" class="hidden">
      <div class="oshead">
        <input id="opLabel" maxlength="6" placeholder="OP" autocomplete="off" spellcheck="false">
        <span class="spacer"></span>
        <button class="mini" id="opDelete">Delete</button>
        <button class="iconbtn" id="opClose" aria-label="Close"><svg viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
      </div>
      <div class="osrow"><label>Side</label>
        <div class="pick" id="opSide">
          <button class="mini" data-v="mine">Mine</button>
          <button class="mini" data-v="enemy">Enemy</button>
          <button class="mini" data-v="npo">NPO</button>
        </div>
      </div>
      <div class="osrow"><label>Base</label>
        <div class="pick" id="opBase">
          <button class="mini" data-v="25">25mm</button>
          <button class="mini" data-v="32">32mm</button>
          <button class="mini" data-v="40">40mm</button>
          <button class="mini" data-v="oval">Oval</button>
        </div>
      </div>
      <div class="osrow"><label>Move</label>
        <div class="pick">
          <button class="mini" id="mvDown">−</button>
          <span id="opMove" class="osval">6″</span>
          <button class="mini" id="mvUp">＋</button>
          <span class="oshint" id="opMoveLeft"></span>
        </div>
      </div>
      <div class="osrow"><label>Keywords</label>
        <div class="pick" id="opKw">
          <button class="mini" data-kw="fly">FLY</button>
          <button class="mini" data-kw="burrow">Burrow</button>
          <button class="mini" data-kw="guard" title="On guard (drops on teleport)">Guard</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Pack picker: the first screen. Pack determines board count, dimensions,
     killzones and NPO set, so it must be chosen before anything is drawn. -->
<div id="picker">
  <div class="phead">
    <div class="peyebrow">Nemesis Operatives</div>
    <h1>Choose a mission pack</h1>
    <div class="psub">Each pack sets its own boards, killzones and adversaries. Descent packs stack an upper and a lower killzone linked by Entryway markers; single-board packs play on one full killzone.</div>
  </div>
  <div id="packlist"></div>
  <div class="pfoot">
    <button class="mini" id="resumeBtn">Resume last</button>
    <button id="startBtn" disabled>Load pack</button>
  </div>
</div>

<script>
"use strict";
const SVGNS="http://www.w3.org/2000/svg";
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];

/* ------------------------------------------------------------------ constants */
// Same fixed scale as the Planner so prefabs, bases and distances are interchangeable
// across the suite. 1 inch = 40 px.
const PPI=40;
const GUTTER=2.0;   // inches of empty space drawn between stacked boards
const AKEY="ktDescentState", PACKKEY="ktDescentPack";

/* ------------------------------------------------------------------ pack registry
   A pack is pure data. It never carries logic — the engine reads these fields and
   the (later) ability dictionary supplies behaviour. Board COUNT is a parameter:
   Descent = 2 boards laid out as a vertical stack with portal links; a single-board
   pack like Terror on Devlan = 1 board and an empty portal graph. The same renderer
   and the same pan/zoom/hit-testing serve both because every board lives in one
   shared world coordinate space, just offset from its neighbour. */
const PACKS = {
  "shadowhunt-joint": {
    name:"Shadowhunt — Joint Ops",
    kind:"pve",
    nemesis:"C'tan Shard of the Nightbringer",
    desc:"Cooperative or solo PvE. Descend through a Necron tomb, scan the sarcophagus, and survive what wakes in the depths.",
    layout:"stack",           // vertical two-board stack
    boards:[
      // Descent killzone: upper = Volkus (30×22 folded to 22×15), lower = Tomb World
      // close-quarters (≈23.9×16.3, a 6×4 square grid). Dimensions in inches.
      { id:"upper", name:"Upper — Volkus", w:22, h:15,
        rules:{ closeQuarters:false }, grid:{mode:"inch",inch:1} },
      { id:"lower", name:"Lower — Tomb World", w:23.9, h:16.3,
        rules:{ closeQuarters:true }, grid:{mode:"squares",cols:6,rows:4} },
    ],
    portals:{ type:"entryway", note:"Numbered Entryway markers link matching pairs between boards." },
    missions:["01 Find the Source","02 The Sarcophagus","03 Rising Doom"],
    npoBudget:110,
  },
  "shadowhunt-adversary": {
    name:"Shadowhunt — Adversary Ops",
    kind:"pvp",
    nemesis:"C'tan Shard of the Nightbringer",
    desc:"Head-to-head PvPvE on the same Descent killzone. Two kill teams race into the tomb while its guardians turn on everyone.",
    layout:"stack",
    boards:[
      { id:"upper", name:"Upper — Volkus", w:22, h:15,
        rules:{ closeQuarters:false }, grid:{mode:"inch",inch:1} },
      { id:"lower", name:"Lower — Tomb World", w:23.9, h:16.3,
        rules:{ closeQuarters:true }, grid:{mode:"squares",cols:6,rows:4} },
    ],
    portals:{ type:"entryway", note:"Numbered Entryway markers link matching pairs between boards." },
    missions:["01 Into the Depths","02 Unlock the Vault","03 Awakening"],
    npoBudget:110,
  },
  "devlan": {
    name:"Terror on Devlan",
    kind:"solo",
    nemesis:"Nemesis operative",
    desc:"Single full-size killzone — no descent. A placeholder single-board pack to prove the engine handles board-count = 1 with an empty portal graph.",
    layout:"single",
    boards:[
      { id:"main", name:"Volkus", w:30, h:22,
        rules:{ closeQuarters:false }, grid:{mode:"inch",inch:1} },
    ],
    portals:null,
    missions:["01 Placeholder"],
    npoBudget:90,
  },
};

/* ------------------------------------------------------------------ state */
const S = {
  packId:null, pack:null,
  boards:[],          // resolved board geometry in world coords (see resolveBoards)
  mode:"move",
  items:[],           // operatives, each with {kind:"op", side, board, x, y, ...}
  markers:[],         // portal markers {kind, mtype, id, board, x, y, pair, ctrl}
  selected:null,      // id of a selected operative
  traverse:null,      // {opId} while waiting for a portal tap to climb through
  measure:null,       // {a,b} while the line tool is dragging
  nextPair:1,         // auto-incrementing Entryway pair number
  opSide:"mine",      // currently-picked side for the Add-operative tool
  msg:null,           // {text} sticky note for a blocked/invalid action (clickable dismiss)
  vb:{x:0,y:0,w:1,h:1},
};

// Keywords that may NOT cross between killzones (pack pg 3). An operative carrying any of
// these can still use a portal WITHIN its own board's rules elsewhere, but the Descent
// climb/teleport between upper and lower is barred. Kept as a set so packs/datacards can
// tag operatives later without touching engine code.
const CROSS_BAN = new Set(["fly","burrow","shadow_passage","aquilon_drop","raven_tunnel","obelisk_matrix"]);
const CTRL_DEFAULT = 1.0;   // control range, inches
const CLIMB_COST = 3.0;     // inches of move spent to climb an Entryway (pack pg 3)

/* ------------------------------------------------------------------ svg scaffold */
const svg=$("#svg");
function mk(t){ return document.createElementNS(SVGNS,t); }
function attr(el,o){ for(const k in o) el.setAttribute(k,o[k]); return el; }
// Layer order mirrors the Planner: boards/plates at the back, grid, links, then items,
// then the transient overlay (selection, measure line).
const gPlate=mk("g"), gGrid=mk("g"), gLink=mk("g"), gMark=mk("g"), gItem=mk("g"), gOvl=mk("g");
[gPlate,gGrid,gLink,gMark,gItem,gOvl].forEach(g=>svg.appendChild(g));
[gPlate,gGrid,gLink,gOvl].forEach(g=>g.setAttribute("pointer-events","none"));

/* ------------------------------------------------------------------ board layout
   Turn each pack board into a placed rectangle in the shared world space. A stack
   lays boards top-to-bottom separated by GUTTER; a single board sits at the origin.
   Cross-board geometry (portal links, a sightline over the gutter) is then just
   ordinary geometry in one coordinate system. */
function resolveBoards(){
  const bs=S.pack.boards, out=[]; let y=0, maxW=0;
  for(const b of bs) maxW=Math.max(maxW, b.w);
  for(const b of bs){
    const wpx=b.w*PPI, hpx=b.h*PPI, cw=maxW*PPI;
    out.push({
      ...b,
      ox:(cw-wpx)/2,        // centre narrower boards under the widest one
      oy:y,
      wpx, hpx,
    });
    y += hpx + GUTTER*PPI;
  }
  S.boards=out;
}
function worldExtent(){
  let x1=0,y1=0,x0=Infinity,y0=Infinity;
  for(const b of S.boards){ x0=Math.min(x0,b.ox); y0=Math.min(y0,b.oy);
    x1=Math.max(x1,b.ox+b.wpx); y1=Math.max(y1,b.oy+b.hpx); }
  if(!isFinite(x0)){x0=0;y0=0;x1=PPI;y1=PPI;}
  return {x0,y0,w:x1-x0,h:y1-y0};
}
function boardById(id){ return S.boards.find(b=>b.id===id); }
// which board does a world point fall in? (used to tag placed items)
function boardAt(x,y){
  for(const b of S.boards){ if(x>=b.ox&&x<=b.ox+b.wpx&&y>=b.oy&&y<=b.oy+b.hpx) return b; }
  return null;
}
// nearest board when a point is in the gutter (clamped), so a marker dragged just off
// a plate still belongs to the closest killzone rather than nowhere
function nearestBoard(x,y){
  let best=null,bd=Infinity;
  for(const b of S.boards){
    const cx=Math.max(b.ox,Math.min(x,b.ox+b.wpx)), cy=Math.max(b.oy,Math.min(y,b.oy+b.hpx));
    const d=Math.hypot(x-cx,y-cy); if(d<bd){ bd=d; best=b; }
  }
  return best;
}

/* ------------------------------------------------------------------ portal graph
   The single primitive behind Descent traversal. An Entryway is a numbered pair of
   markers, one per board; a teleport pad likewise links two points on different boards.
   Ravener tunnels and Ambull BURROW (later packs) reuse exactly this pairing — that's
   why it lives in the engine, not in any pack. */
function distIn(ax,ay,bx,by){ return Math.hypot(ax-bx,ay-by)/PPI; }   // world px → inches
function markerById(id){ return S.markers.find(m=>m.id===id); }
function twinOf(m){
  if(m.mtype==="entryway") return S.markers.find(x=>x!==m && x.mtype==="entryway" && x.pair===m.pair);
  if(m.mtype==="teleport")  return S.markers.find(x=>x!==m && x.mtype==="teleport"  && x.pair===m.pair);
  return null;
}
// markers whose control range covers a point (op is "at" the marker if within ctrl range)
function markersInControl(x,y){
  return S.markers.filter(m=>distIn(x,y,m.x,m.y) <= (m.ctrl||CTRL_DEFAULT));
}
// place an Entryway pair: one marker on each board, at matching relative x, tucked a short
// way in from the gutter edge so the link reads cleanly. Numbered automatically.
function placeEntrywayPair(worldX){
  if(S.boards.length<2){ note("Entryway markers need two boards. This pack has one killzone."); return; }
  const up=S.boards[0], lo=S.boards[1], n=S.nextPair++;
  const clampX=(b)=>Math.max(b.ox+18,Math.min(worldX,b.ox+b.wpx-18));
  const mk1={kind:"marker",mtype:"entryway",id:crypto.randomUUID(),pair:n,board:up.id,
    x:clampX(up), y:up.oy+up.hpx-16, ctrl:CTRL_DEFAULT};
  const mk2={kind:"marker",mtype:"entryway",id:crypto.randomUUID(),pair:n,board:lo.id,
    x:clampX(lo), y:lo.oy+16, ctrl:CTRL_DEFAULT};
  S.markers.push(mk1,mk2); save(); renderMarkers(); renderLinks();
  note(`Entryway ${n} placed — a linked pair, one per killzone. Drag either marker to reposition.`,true);
}
function placeTeleportPair(worldX){
  if(S.boards.length<2){ note("Teleport pads link two killzones. This pack has one."); return; }
  const up=S.boards[0], lo=S.boards[1], n=S.nextPair++;
  const clampX=(b)=>Math.max(b.ox+18,Math.min(worldX,b.ox+b.wpx-18));
  S.markers.push(
    {kind:"marker",mtype:"teleport",id:crypto.randomUUID(),pair:n,board:up.id,x:clampX(up),y:up.oy+up.hpx*0.5,ctrl:CTRL_DEFAULT},
    {kind:"marker",mtype:"teleport",id:crypto.randomUUID(),pair:n,board:lo.id,x:clampX(lo),y:lo.oy+lo.hpx*0.5,ctrl:CTRL_DEFAULT});
  save(); renderMarkers(); renderLinks();
  note(`Teleport pad ${n} placed. An operative on guard loses guard when it teleports between killzones.`,true);
}

// The traverse action. Returns {ok, reason}. On success the op is moved to the twin
// marker's control range on the other board, retagged, and its move budget is charged.
function climbThrough(op, marker){
  const twin=twinOf(marker);
  if(!twin) return {ok:false, reason:`Entryway ${marker.pair} has no twin on the other board. Place its pair first.`};
  if(op.board===twin.board) return {ok:false, reason:"That marker leads back to the same killzone."};
  // crossing bans — surfaced, not silently dropped
  const banned=(op.keywords||[]).find(k=>CROSS_BAN.has(k));
  if(banned) return {ok:false, reason:`${labelKw(banned)} can't move between killzones in a Descent killzone (pack rule). It stays in ${op.board}.`};
  // move-budget check: climbing costs 3". If the op has a move budget tracked, enforce it;
  // if not (free placement during setup), allow and just report.
  const budget = (op.moveLeft!=null) ? op.moveLeft : (op.move!=null ? op.move : null);
  if(budget!=null && budget < CLIMB_COST - 1e-9)
    return {ok:false, reason:`Climbing costs ${CLIMB_COST}". ${op.label||"This operative"} has only ${budget.toFixed(1)}" of move left.`};
  // set the op down so the twin marker is within its control range: land it just inside
  // the twin's control ring, offset toward the board centre so it's a legal-ish spot.
  const b=boardById(twin.board), toC=Math.atan2((b.oy+b.hpx/2)-twin.y,(b.ox+b.wpx/2)-twin.x);
  const r=(twin.ctrl||CTRL_DEFAULT)*PPI*0.6;
  op.x=twin.x+Math.cos(toC)*r; op.y=twin.y+Math.sin(toC)*r; op.board=twin.board;
  if(op.moveLeft!=null) op.moveLeft=Math.max(0, op.moveLeft-CLIMB_COST);
  // guard drops on a teleport between killzones
  let extra="";
  if(marker.mtype==="teleport" && op.guard){ op.guard=false; extra=" Guard dropped."; }
  return {ok:true, remain:(op.moveLeft!=null?op.moveLeft:null), extra};
}
function labelKw(k){ return ({fly:"FLY",burrow:"BURROW",shadow_passage:"SHADOW PASSAGE",
  aquilon_drop:"Aquilon Drop",raven_tunnel:"Ravener Tunnel",obelisk_matrix:"Obelisk Node matrix"})[k]||k; }

/* ------------------------------------------------------------------ view */
function applyVB(){ svg.setAttribute("viewBox",`${S.vb.x} ${S.vb.y} ${S.vb.w} ${S.vb.h}`); }
function syncAspect(){ const r=svg.getBoundingClientRect(); if(r.width) S.vb.h=S.vb.w*(r.height/r.width); }
function fitView(){
  const r=svg.getBoundingClientRect(); const ar=(r.height/r.width)||1.4;
  const ext=worldExtent(), pad=1.12;
  const ew=ext.w*pad, eh=ext.h*pad;
  let w=ew, h=w*ar;
  if(h<eh){ h=eh; w=h/ar; }
  S.vb={ x:ext.x0+ext.w/2-w/2, y:ext.y0+ext.h/2-h/2, w, h };
  applyVB();
}
function clientToWorld(cx,cy){
  const m=svg.getScreenCTM();
  if(m){ const p=svg.createSVGPoint(); p.x=cx; p.y=cy; const w=p.matrixTransform(m.inverse()); return {x:w.x,y:w.y}; }
  const r=svg.getBoundingClientRect();
  return {x:S.vb.x+(cx-r.left)/r.width*S.vb.w, y:S.vb.y+(cy-r.top)/r.height*S.vb.h};
}
function zoomAround(cx,cy,f){ const w=clientToWorld(cx,cy);
  S.vb.w*=f; S.vb.h*=f; S.vb.x=w.x-(w.x-S.vb.x)*f; S.vb.y=w.y-(w.y-S.vb.y)*f; applyVB(); }
function panClient(dx,dy){ const r=svg.getBoundingClientRect(),k=S.vb.w/r.width;
  S.vb.x-=dx*k; S.vb.y-=dy*k; applyVB(); }

/* ------------------------------------------------------------------ render */
function renderAll(){ renderPlates(); renderGrid(); renderLinks(); renderMarkers(); renderItems(); renderOverlay(); }

function renderPlates(){
  gPlate.replaceChildren();
  for(const b of S.boards){
    // gutter shading above each board after the first
    gPlate.appendChild(attr(mk("rect"),{class:"plate",x:b.ox,y:b.oy,width:b.wpx,height:b.hpx,rx:4}));
    // killzone identity tint down the left edge
    const tint = b.id==="upper" ? "var(--upper)" : b.id==="lower" ? "var(--lower)" : "var(--orange)";
    gPlate.appendChild(attr(mk("rect"),{x:b.ox,y:b.oy,width:5,height:b.hpx,fill:tint,opacity:.5}));
    // label in the top-left of the plate
    const t=attr(Object.assign(mk("text"),{textContent:b.name.toUpperCase()}),
      {x:b.ox+12,y:b.oy+18,class:"kzlabel"});
    gPlate.appendChild(t);
    // close-quarters boards get a subtle badge
    if(b.rules&&b.rules.closeQuarters){
      const cq=attr(Object.assign(mk("text"),{textContent:"CLOSE QUARTERS"}),
        {x:b.ox+b.wpx-12,y:b.oy+18,class:"kzlabel","text-anchor":"end"});
      cq.setAttribute("opacity",".7"); gPlate.appendChild(cq);
    }
  }
}

function renderGrid(){
  gGrid.replaceChildren();
  for(const b of S.boards){
    const g=b.grid||{mode:"inch",inch:1};
    if(g.mode==="squares"){
      const cols=g.cols||6, rows=g.rows||4;
      for(let i=1;i<cols;i++){ const x=b.ox+i*b.wpx/cols;
        gGrid.appendChild(attr(mk("line"),{x1:x,y1:b.oy,x2:x,y2:b.oy+b.hpx,
          stroke:"#2c3742","stroke-width":1,"vector-effect":"non-scaling-stroke"})); }
      for(let j=1;j<rows;j++){ const y=b.oy+j*b.hpx/rows;
        gGrid.appendChild(attr(mk("line"),{x1:b.ox,y1:y,x2:b.ox+b.wpx,y2:y,
          stroke:"#2c3742","stroke-width":1,"vector-effect":"non-scaling-stroke"})); }
    }else{
      const step=Math.max(6,(g.inch||1)*PPI);
      for(let x=step;x<b.wpx-.5;x+=step)
        gGrid.appendChild(attr(mk("line"),{x1:b.ox+x,y1:b.oy,x2:b.ox+x,y2:b.oy+b.hpx,
          stroke:"#242d35","stroke-width":.7,"vector-effect":"non-scaling-stroke"}));
      for(let y=step;y<b.hpx-.5;y+=step)
        gGrid.appendChild(attr(mk("line"),{x1:b.ox,y1:b.oy+y,x2:b.ox+b.wpx,y2:b.oy+y,
          stroke:"#242d35","stroke-width":.7,"vector-effect":"non-scaling-stroke"}));
    }
  }
}

// Portal links: draw a connector between each real marker pair, curved through the gutter
// so several links don't overlap into one line. Entryways are dashed orange, teleports
// solid teal. Drawn only for pairs that actually exist on both boards.
function renderLinks(){
  gLink.replaceChildren();
  const seen=new Set();
  for(const m of S.markers){
    const key=m.mtype+":"+m.pair; if(seen.has(key)) continue;
    const tw=twinOf(m); if(!tw) continue; seen.add(key);
    // control point bowed sideways so parallel links fan out
    const mx=(m.x+tw.x)/2, my=(m.y+tw.y)/2, bow=((m.pair*37)%80-40);
    const d=`M${m.x} ${m.y} Q ${mx+bow} ${my} ${tw.x} ${tw.y}`;
    const col = m.mtype==="teleport" ? "var(--teal)" : "var(--orange)";
    const p=attr(mk("path"),{d,fill:"none",stroke:col,"stroke-width":1.3,opacity:.45,
      "vector-effect":"non-scaling-stroke"});
    if(m.mtype==="entryway") p.setAttribute("stroke-dasharray","5 5");
    gLink.appendChild(p);
  }
}

// Portal markers. Entryway = numbered diamond, teleport = ringed circle. Control range
// drawn as a faint ring so you can see who's "at" the marker. Tinted by board identity.
function renderMarkers(){
  gMark.replaceChildren();
  for(const m of S.markers){
    const g=attr(mk("g"),{"data-mid":m.id});
    const tint = m.board==="upper" ? "var(--upper)" : m.board==="lower" ? "var(--lower)" : "var(--orange)";
    const r=(m.ctrl||CTRL_DEFAULT)*PPI;
    // control ring
    g.appendChild(attr(mk("circle"),{cx:m.x,cy:m.y,r,fill:"none",stroke:tint,
      "stroke-width":1,opacity:.22,"stroke-dasharray":"3 4","vector-effect":"non-scaling-stroke"}));
    if(m.mtype==="entryway"){
      const s=11;
      g.appendChild(attr(mk("path"),{d:`M${m.x} ${m.y-s} L${m.x+s} ${m.y} L${m.x} ${m.y+s} L${m.x-s} ${m.y} Z`,
        fill:"rgba(242,160,61,.16)",stroke:"var(--orange)","stroke-width":1.8,"vector-effect":"non-scaling-stroke"}));
      g.appendChild(attr(Object.assign(mk("text"),{textContent:m.pair}),
        {x:m.x,y:m.y+3.5,"text-anchor":"middle","font-size":11,"font-family":"var(--mono)",
         fill:"var(--orange)","font-weight":700,"pointer-events":"none"}));
    }else{
      g.appendChild(attr(mk("circle"),{cx:m.x,cy:m.y,r:10,fill:"rgba(43,184,184,.14)",
        stroke:"var(--teal)","stroke-width":1.8,"vector-effect":"non-scaling-stroke"}));
      g.appendChild(attr(mk("circle"),{cx:m.x,cy:m.y,r:4,fill:"none",stroke:"var(--teal)",
        "stroke-width":1.4,"vector-effect":"non-scaling-stroke"}));
    }
    gMark.appendChild(g);
  }
}

function itemR(t){
  if(t.base==="oval") return (60/25.4)/2*PPI;   // long axis radius, for hit-testing
  return ((t.baseMm||t.base||32)/25.4)/2*PPI;
}
function renderItems(){
  gItem.replaceChildren();
  for(const t of S.items){
    const g=attr(mk("g"),{"data-id":t.id});
    const col = t.side==="npo" ? {fill:"rgba(192,90,43,.9)",stroke:"#e0793f"}
             : t.side==="enemy" ? {fill:"rgba(43,184,184,.9)",stroke:"#4fdede"}
             : {fill:"rgba(229,72,77,.9)",stroke:"#ff6b66"};
    if(t.base==="oval"){
      // 60×35mm oval, direction-aware, matching the Planner's Wolf Scout base.
      const rx=(60/25.4)/2*PPI, ry=(35/25.4)/2*PPI, ang=t.ang||0;
      const el=attr(mk("ellipse"),{cx:0,cy:0,rx,ry,fill:col.fill,stroke:col.stroke,
        "stroke-width":2,"vector-effect":"non-scaling-stroke"});
      const wrap=attr(mk("g"),{transform:`translate(${t.x} ${t.y}) rotate(${ang})`});
      wrap.appendChild(el);
      // facing tick toward the long axis
      wrap.appendChild(attr(mk("line"),{x1:rx-6,y1:0,x2:rx,y2:0,stroke:col.stroke,
        "stroke-width":2,"vector-effect":"non-scaling-stroke"}));
      g.appendChild(wrap);
    }else{
      g.appendChild(attr(mk("circle"),{cx:t.x,cy:t.y,r:itemR(t),
        fill:col.fill,stroke:col.stroke,"stroke-width":2,"vector-effect":"non-scaling-stroke"}));
    }
    if(t.label){
      g.appendChild(attr(Object.assign(mk("text"),{textContent:t.label}),
        {x:t.x,y:t.y+3,"text-anchor":"middle","font-size":10,"font-family":"var(--mono)",
         fill:"#0d1013","font-weight":700,"pointer-events":"none"}));
    }
    gItem.appendChild(g);
  }
}

function renderOverlay(){
  gOvl.replaceChildren();
  if(S.selected){
    const t=S.items.find(i=>i.id===S.selected);
    if(t) gOvl.appendChild(attr(mk("circle"),{cx:t.x,cy:t.y,r:itemR(t)+4,
      fill:"none",stroke:"var(--orange)","stroke-width":2,"stroke-dasharray":"4 3",
      "vector-effect":"non-scaling-stroke"}));
  }
  if(S.measure){ const m=S.measure;
    gOvl.appendChild(attr(mk("line"),{x1:m.a.x,y1:m.a.y,x2:m.b.x,y2:m.b.y,
      stroke:"var(--orange)","stroke-width":1.6,"vector-effect":"non-scaling-stroke"}));
    const dpx=Math.hypot(m.b.x-m.a.x,m.b.y-m.a.y);
    // cross-board distances are meaningful here because both boards share world coords
    const mx=(m.a.x+m.b.x)/2, my=(m.a.y+m.b.y)/2;
    gOvl.appendChild(attr(Object.assign(mk("text"),{textContent:(dpx/PPI).toFixed(1)+'"'}),
      {x:mx,y:my-6,"text-anchor":"middle","font-size":12,"font-family":"var(--mono)",
       fill:"var(--orange)","paint-order":"stroke",stroke:"var(--bg)","stroke-width":3}));
  }
}

/* ------------------------------------------------------------------ HUD */
function hud(msg){
  const b=boardAt(...(S._lastWorld||[0,0]));
  const where = b ? `<span class="k">board</span> <b>${b.id}</b>` : `<span class="k">—</span>`;
  $("#hud").innerHTML = `<b>${msg||"Ready"}</b> · ${where} · <span class="k">ops</span> <b>${S.items.length}</b> · <span class="k">markers</span> <b>${S.markers.length}</b>`;
}
// clickable sticky note for blocked/invalid actions (or a positive confirmation with good=true)
function note(text,good){
  const el=$("#note"); $("#noteText").textContent=text;
  el.classList.toggle("good",!!good); el.classList.remove("hidden");
  clearTimeout(note._t);
  if(good) note._t=setTimeout(()=>el.classList.add("hidden"),3200);
}
$("#noteX").addEventListener("click",()=>$("#note").classList.add("hidden"));

/* ------------------------------------------------------------------ pointer / pan / zoom
   Lifted from the Planner: single-pointer drag pans or moves an item; two pointers
   pinch-zoom. Because there is one world space, none of this needs to know about
   boards. */
const pointers=new Map(); let drag=null,lastPinch=null;
function itemAt(w){
  for(let i=S.items.length-1;i>=0;i--){ const t=S.items[i];
    if(Math.hypot(w.x-t.x,w.y-t.y)<=itemR(t)+6) return t; }
  return null;
}
function markerAt(w){
  for(let i=S.markers.length-1;i>=0;i--){ const m=S.markers[i];
    if(Math.hypot(w.x-m.x,w.y-m.y)<=13) return m; }
  return null;
}
svg.addEventListener("pointerdown",e=>{
  svg.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size>=2){ drag=null; lastPinch=null; return; }
  const w=clientToWorld(e.clientX,e.clientY);
  S._lastWorld=[w.x,w.y];

  if(S.mode==="measure"){ drag={type:"line",a:w}; S.measure={a:w,b:w}; renderOverlay(); return; }

  // Portals tool: a plain tap on empty space does nothing (use the ＋ buttons to place a
  // pair); tapping an existing marker lets you drag it to reposition.
  if(S.mode==="marker"){
    const m=markerAt(w);
    if(m){ drag={type:"marker",m,ox:w.x-m.x,oy:w.y-m.y,moved:false}; return; }
    drag={type:"pan",sx:e.clientX,sy:e.clientY}; return;
  }

  // Add-operative tool: tap the board to drop an op of the currently-picked side.
  if(S.mode==="op"){
    const b=boardAt(w.x,w.y);
    if(!b){ note("Tap inside a killzone to place an operative."); drag={type:"pan",sx:e.clientX,sy:e.clientY}; return; }
    const op=makeOp(S.opSide||"mine", b.id, w.x, w.y);
    S.items.push(op); S.selected=op.id; save(); renderItems(); renderOverlay();
    openOpSheet(op); hud("Placed");
    drag={type:"item",t:op,ox:0,oy:0,moved:false};  // allow immediate nudge
    return;
  }

  // Traverse: an operative is selected and we're waiting for a portal tap.
  if(S.traverse){
    const m=markerAt(w);
    if(m){ doTraverse(S.traverse.opId, m); return; }
    // tapping elsewhere cancels traverse targeting
    S.traverse=null; updateTraverseChip();
  }

  // Move tool: markers first (so you can grab one), then operatives.
  const m=markerAt(w);
  if(m && S.mode==="move"){ drag={type:"marker",m,ox:w.x-m.x,oy:w.y-m.y,moved:false}; return; }
  const t=itemAt(w);
  if(t){ S.selected=t.id; drag={type:"item",t,ox:w.x-t.x,oy:w.y-t.y,moved:false};
    renderOverlay(); updateTraverseChip(); openOpSheet(t); hud("Selected"); return; }

  S.selected=null; S.traverse=null; closeOpSheet(); updateTraverseChip(); renderOverlay();
  drag={type:"pan",sx:e.clientX,sy:e.clientY,vb:{...S.vb}};
});
function onMove(e){
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size>=2){ doPinch(); return; }
  if(!drag) return;
  const w=clientToWorld(e.clientX,e.clientY); S._lastWorld=[w.x,w.y];
  if(drag.type==="pan"){ panClient(e.clientX-drag.sx,e.clientY-drag.sy); drag.sx=e.clientX; drag.sy=e.clientY; }
  else if(drag.type==="item"){ drag.t.x=w.x-drag.ox; drag.t.y=w.y-drag.oy; drag.moved=true;
    renderItems(); renderOverlay(); }
  else if(drag.type==="marker"){ drag.m.x=w.x-drag.ox; drag.m.y=w.y-drag.oy; drag.moved=true;
    renderMarkers(); renderLinks(); }
  else if(drag.type==="line"){ S.measure.b=w; renderOverlay(); }
}
function endP(e){
  if(!pointers.has(e.pointerId)) return; pointers.delete(e.pointerId);
  if(pointers.size<2) lastPinch=null;
  if(drag&&drag.type==="item"&&drag.moved){
    // re-tag the item to whichever board it now sits in; keep it if dropped in a gutter
    const b=boardAt(drag.t.x,drag.t.y); if(b) drag.t.board=b.id;
    save(); hud("Moved");
  }
  if(drag&&drag.type==="marker"&&drag.moved){
    // a marker follows its plate; snap its board tag to the nearest killzone
    const b=nearestBoard(drag.m.x,drag.m.y); if(b) drag.m.board=b.id;
    save(); renderLinks(); hud("Marker moved");
  }
  if(drag&&drag.type==="line"){ S.measure=null; renderOverlay(); }
  drag=null;
}
window.addEventListener("pointermove",onMove,{passive:false});
window.addEventListener("pointerup",endP);
window.addEventListener("pointercancel",endP);
function doPinch(){ const p=[...pointers.values()]; if(p.length<2) return;
  const dx=p[0].x-p[1].x, dy=p[0].y-p[1].y, d=Math.hypot(dx,dy);
  const mid={x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2};
  if(lastPinch){ zoomAround(mid.x,mid.y,lastPinch.d/d); panClient(mid.x-lastPinch.mid.x,mid.y-lastPinch.mid.y); }
  lastPinch={d,mid}; }

/* ------------------------------------------------------------------ toolbar */
$("#toolseg").addEventListener("click",e=>{ const b=e.target.closest("[data-mode]"); if(!b) return;
  S.mode=b.dataset.mode; $$("#toolseg .tool").forEach(x=>x.classList.toggle("on",x===b));
  // the marker submenu only makes sense while the Portals tool is active
  $("#markerSub").classList.toggle("hidden", S.mode!=="marker");
  $("#opSub").classList.toggle("hidden", S.mode!=="op");
  if(S.mode!=="move"){ S.traverse=null; closeOpSheet(); }
  updateTraverseChip();
});
// op side picker
$("#opSub").addEventListener("click",e=>{ const b=e.target.closest("[data-side]"); if(!b) return;
  S.opSide=b.dataset.side; $$("#opSub .mini").forEach(x=>x.classList.toggle("on",x===b)); });

/* ------------------------------------------------------------------ operative factory
   Sensible defaults per side; the editor sheet tweaks the rest. base as a string keeps
   circles ("25"/"32"/"40") and "oval" in one field the portal engine ignores. */
const OP_DEFAULTS={ mine:{move:6,base:"32",label:"OP"}, enemy:{move:6,base:"32",label:"EN"}, npo:{move:6,base:"40",label:"NPO"} };
function makeOp(side,boardId,x,y){
  const d=OP_DEFAULTS[side]||OP_DEFAULTS.mine;
  return {id:crypto.randomUUID(),kind:"op",side,board:boardId,x,y,label:d.label,
    base:d.base, baseMm:(d.base==="oval"?40:+d.base), move:d.move, moveLeft:d.move,
    ang:0, guard:false, keywords:[]};
}

/* ------------------------------------------------------------------ op editor sheet */
let sheetOp=null;
function openOpSheet(op){ if(!op||op.kind!=="op"){ closeOpSheet(); return; } sheetOp=op; bindOpSheet(); $("#opSheet").classList.remove("hidden"); }
function closeOpSheet(){ sheetOp=null; $("#opSheet").classList.add("hidden"); }
function bindOpSheet(){
  const op=sheetOp; if(!op) return;
  $("#opLabel").value=op.label||"";
  $$("#opSide .mini").forEach(b=>b.classList.toggle("on",b.dataset.v===op.side));
  const baseKey = op.base || String(op.baseMm||32);
  $$("#opBase .mini").forEach(b=>b.classList.toggle("on",b.dataset.v===baseKey));
  $("#opMove").textContent=(op.move??6)+"″";
  $("#opMoveLeft").textContent = op.moveLeft!=null ? `${op.moveLeft.toFixed(1)}″ left` : "";
  $$("#opKw .mini").forEach(b=>{
    const on = b.dataset.kw==="guard" ? !!op.guard : (op.keywords||[]).includes(b.dataset.kw);
    b.classList.toggle("on",on);
  });
}
$("#opClose").addEventListener("click",closeOpSheet);
$("#opLabel").addEventListener("input",e=>{ if(!sheetOp) return;
  sheetOp.label=e.target.value.toUpperCase().slice(0,6); renderItems(); save(); });
$("#opSide").addEventListener("click",e=>{ const b=e.target.closest("[data-v]"); if(!b||!sheetOp) return;
  sheetOp.side=b.dataset.v; bindOpSheet(); renderItems(); renderOverlay(); save(); });
$("#opBase").addEventListener("click",e=>{ const b=e.target.closest("[data-v]"); if(!b||!sheetOp) return;
  sheetOp.base=b.dataset.v; sheetOp.baseMm = b.dataset.v==="oval"?40:+b.dataset.v;
  bindOpSheet(); renderItems(); renderOverlay(); save(); });
$("#mvUp").addEventListener("click",()=>{ if(!sheetOp) return;
  sheetOp.move=Math.min(12,(sheetOp.move||6)+1); sheetOp.moveLeft=sheetOp.move; bindOpSheet(); save(); });
$("#mvDown").addEventListener("click",()=>{ if(!sheetOp) return;
  sheetOp.move=Math.max(1,(sheetOp.move||6)-1); sheetOp.moveLeft=sheetOp.move; bindOpSheet(); save(); });
$("#opKw").addEventListener("click",e=>{ const b=e.target.closest("[data-kw]"); if(!b||!sheetOp) return;
  const kw=b.dataset.kw;
  if(kw==="guard"){ sheetOp.guard=!sheetOp.guard; }
  else{ sheetOp.keywords=sheetOp.keywords||[];
    const i=sheetOp.keywords.indexOf(kw);
    if(i>=0) sheetOp.keywords.splice(i,1); else sheetOp.keywords.push(kw); }
  bindOpSheet(); save();
});
$("#opDelete").addEventListener("click",()=>{ if(!sheetOp) return;
  S.items=S.items.filter(i=>i!==sheetOp);
  if(S.selected===sheetOp.id){ S.selected=null; S.traverse=null; }
  closeOpSheet(); renderItems(); renderOverlay(); updateTraverseChip(); save(); hud("Deleted");
});

$("#addEntry").addEventListener("click",()=>{ const w=S._lastWorld||[centreX(),0]; placeEntrywayPair(w[0]); });
$("#addTele").addEventListener("click",()=>{ const w=S._lastWorld||[centreX(),0]; placeTeleportPair(w[0]); });
function centreX(){ const b=S.boards[0]; return b?b.ox+b.wpx/2:0; }
$("#fitBtn").addEventListener("click",fitView);

/* ------------------------------------------------------------------ traverse UX
   When an operative is selected and the pack has ≥2 boards, offer to climb: a chip in
   the toolbar arms traverse targeting, then the next portal tap resolves climbThrough. */
function updateTraverseChip(){
  const chip=$("#traverseChip");
  const op=S.items.find(i=>i.id===S.selected);
  const canOffer = op && op.kind==="op" && S.boards.length>=2 && S.mode==="move";
  chip.classList.toggle("hidden", !canOffer);
  chip.classList.toggle("on", !!S.traverse);
  chip.textContent = S.traverse ? "Tap a portal to climb — or tap away to cancel"
                                : "Climb a portal";
}
$("#traverseChip").addEventListener("click",()=>{
  const op=S.items.find(i=>i.id===S.selected); if(!op) return;
  S.traverse = S.traverse ? null : {opId:op.id};
  updateTraverseChip();
  if(S.traverse) note("Tap an Entryway or teleport marker within this operative's control range to climb through.",true);
});
function doTraverse(opId, marker){
  const op=S.items.find(i=>i.id===opId); if(!op){ S.traverse=null; return; }
  // the op must actually have the marker within control range to use it
  if(distIn(op.x,op.y,marker.x,marker.y) > (marker.ctrl||CTRL_DEFAULT)+1e-6){
    note(`That marker isn't within ${op.label||"the operative"}'s control range (${(marker.ctrl||CTRL_DEFAULT)}"). Move closer first.`);
    return;
  }
  const res=climbThrough(op, marker);
  if(!res.ok){ note(res.reason); return; }
  S.traverse=null; save(); renderItems(); renderOverlay(); updateTraverseChip();
  if(sheetOp&&sheetOp.id===op.id) bindOpSheet();
  const remain = res.remain!=null ? ` ${res.remain.toFixed(1)}" of move left.` : "";
  note(`${op.label||"Operative"} climbed to ${op.board}.${remain}${res.extra||""}`,true);
  hud("Climbed");
}
$("#packBtn").addEventListener("click",openPicker);

/* ------------------------------------------------------------------ pack picker */
function renderPackList(){
  const list=$("#packlist"); list.replaceChildren();
  for(const [id,p] of Object.entries(PACKS)){
    const el=document.createElement("div"); el.className="pack"; el.dataset.pack=id;
    const kindLabel = p.kind==="pve"?"Co-op / Solo · PvE" : p.kind==="pvp"?"Versus · PvPvE" : "Solo";
    const boardsChips = p.boards.map(b=>{
      const cls = b.id==="upper"?"up" : b.id==="lower"?"lo" : "up";
      return `<span class="boardchip ${cls}"><i></i>${b.w}×${b.h}"</span>`;
    }).join(" ");
    el.innerHTML=`
      <div class="prow"><span class="pname">${p.name}</span>
        <span class="pkind ${p.kind}">${kindLabel}</span></div>
      <div class="pdesc">${p.desc}</div>
      <div class="pmeta">
        <span><b>Boards</b> ${boardsChips}</span>
        <span><b>Nemesis</b> ${p.nemesis}</span>
        <span><b>Missions</b> ${p.missions.length}</span>
      </div>`;
    list.appendChild(el);
  }
}
let pickSel=null;
$("#packlist").addEventListener("click",e=>{ const el=e.target.closest(".pack"); if(!el) return;
  pickSel=el.dataset.pack;
  $$(".pack").forEach(x=>x.classList.toggle("sel",x===el));
  $("#startBtn").disabled=false;
  $("#startBtn").textContent="Load "+PACKS[pickSel].name.split(" — ")[0];
});
$("#startBtn").addEventListener("click",()=>{ if(pickSel) loadPack(pickSel); });
$("#resumeBtn").addEventListener("click",()=>{ if(!restore()) hud("Nothing to resume"); });
function openPicker(){ renderPackList(); $("#picker").classList.remove("hidden");
  const saved=localStorage.getItem(PACKKEY);
  $("#resumeBtn").style.display = saved ? "" : "none";
}

/* ------------------------------------------------------------------ load / persist */
function loadPack(id){
  S.packId=id; S.pack=PACKS[id]; S.items=[]; S.markers=[]; S.nextPair=1;
  S.selected=null; S.traverse=null;
  resolveBoards();
  $("#picker").classList.add("hidden");
  $("#packTag").textContent = S.pack.name + " · " + S.pack.missions[0];
  syncAspect(); renderAll(); fitView(); hud("Pack loaded");
  save();
}
function save(){
  try{ localStorage.setItem(PACKKEY,S.packId);
    localStorage.setItem(AKEY,JSON.stringify({packId:S.packId,items:S.items,markers:S.markers,nextPair:S.nextPair})); }catch(_){}
}
function restore(){
  let d=null;
  try{ d=JSON.parse(localStorage.getItem(AKEY)||"null"); }catch(_){}
  if(!d||!d.packId||!PACKS[d.packId]) return false;
  S.packId=d.packId; S.pack=PACKS[d.packId]; S.items=d.items||[];
  S.markers=d.markers||[]; S.nextPair=d.nextPair||1; S.selected=null; S.traverse=null;
  resolveBoards();
  $("#picker").classList.add("hidden");
  $("#packTag").textContent=S.pack.name+" · "+S.pack.missions[0];
  syncAspect(); renderAll(); fitView(); hud("Resumed");
  return true;
}

/* ------------------------------------------------------------------ resize */
window.addEventListener("resize",()=>{ syncAspect(); applyVB(); });
if(window.ResizeObserver) new ResizeObserver(()=>{ syncAspect(); applyVB(); }).observe(svg);
function resetPointers(){ pointers.clear(); drag=null; lastPinch=null; }
document.addEventListener("visibilitychange",resetPointers);
window.addEventListener("blur",resetPointers);
document.addEventListener("touchmove",e=>{ if(!e.target.closest("#picker,#note,#opSheet")) e.preventDefault(); },{passive:false});

/* ------------------------------------------------------------------ dev seed
   A couple of placeholder tokens so the two-board hull is visibly alive: one player
   operative up top, one NPO down in the tomb. Removed once real deployment lands. */
function seed(){
  const up=boardById(S.boards[0].id), lo=S.boards[S.boards.length-1];
  // a normal operative (can traverse), a FLY operative (barred between killzones), and an NPO
  S.items.push({id:crypto.randomUUID(),kind:"op",side:"mine",board:up.id,label:"OP",
    x:up.ox+up.wpx*0.35,y:up.oy+up.hpx*0.6,base:"32",baseMm:32,move:6,moveLeft:6,ang:0,guard:false,keywords:[]});
  S.items.push({id:crypto.randomUUID(),kind:"op",side:"mine",board:up.id,label:"FLY",
    x:up.ox+up.wpx*0.5,y:up.oy+up.hpx*0.45,base:"32",baseMm:32,move:7,moveLeft:7,ang:0,guard:false,keywords:["fly"]});
  S.items.push({id:crypto.randomUUID(),kind:"op",side:"npo",board:lo.id,label:"NPO",
    x:lo.ox+lo.wpx*0.6,y:lo.oy+lo.hpx*0.5,base:"40",baseMm:40,move:6,moveLeft:6,ang:0,guard:false,keywords:[]});
}

/* ------------------------------------------------------------------ service worker */
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}

/* ------------------------------------------------------------------ boot */
(function boot(){
  renderPackList();
  const saved=localStorage.getItem(PACKKEY);
  $("#resumeBtn").style.display = saved ? "" : "none";
  // Auto-resume a prior session so a returning player lands straight on their board;
  // if there's nothing to resume, the picker stays up as the first screen.
  if(!restore()){
    // dev convenience: if you want to see the hull immediately without picking,
    // uncomment the next two lines.
    // loadPack("shadowhunt-joint"); seed(); renderItems();
    $("#picker").classList.remove("hidden");
  }
})();
</script>
</body>
</html>
