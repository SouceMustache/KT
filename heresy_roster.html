<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VI Legion — Space Wolves · roster</title>
<style>
  :root{
    --bg:#0d1117; --surface:#161b24; --card:#1c2333; --border:#2a3347;
    --accent:#4a9eff; --accent2:#7ec8e3; --text:#e6edf3; --muted:#8b949e;
    --gold:#d4a843; --red:#e05c5c; --green:#4ac07a; --overlay:rgba(10,13,20,0.97);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}

  header{background:linear-gradient(180deg,#0a0e16,var(--bg));border-bottom:1px solid var(--border);padding:18px 16px 12px;position:sticky;top:0;z-index:10;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  header h1{font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
  header h2{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
  .tools-btn{flex:none;background:var(--card);border:1px solid var(--border);color:var(--accent2);font-size:11px;font-weight:700;letter-spacing:.05em;padding:8px 10px;border-radius:8px;cursor:pointer}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 12px 40px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 12px 10px;cursor:pointer;position:relative;overflow:hidden;transition:border-color .15s,transform .1s;user-select:none}
  .card:active{transform:scale(.97);border-color:var(--accent)}
  .card::after{content:attr(data-rune);position:absolute;bottom:-8px;right:6px;font-size:46px;opacity:.05;line-height:1;pointer-events:none;font-weight:900;color:var(--accent2)}
  .card-role{font-size:10px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--accent)}
  .card-name{font-size:14px;font-weight:700;line-height:1.15;margin:3px 0 8px}
  .card-cost{position:absolute;top:10px;right:10px;background:var(--gold);color:#0d1117;font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px}
  .mini{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;margin-top:6px}
  .mini div{text-align:center}
  .mini .k{font-size:8px;color:var(--muted);letter-spacing:.03em}
  .mini .v{font-size:11px;font-weight:700}

  .overlay{position:fixed;inset:0;background:var(--overlay);z-index:50;display:none;overflow-y:auto;padding:16px 12px 60px}
  .overlay.show{display:block}
  .sheet{max-width:520px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px}
  .oh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:12px}
  .oh .role{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .oh h3{font-size:19px;font-weight:800;line-height:1.1;margin-top:2px}
  .oh .cost{flex:none;background:var(--gold);color:#0d1117;font-size:12px;font-weight:800;padding:4px 8px;border-radius:6px}

  .sec{margin:14px 0}
  .sec-t{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2);font-weight:700;margin-bottom:6px}
  table.stats{width:100%;border-collapse:collapse;font-size:12px}
  table.stats th{font-size:9px;color:var(--muted);font-weight:600;padding:3px 2px;text-align:center;border-bottom:1px solid var(--border)}
  table.stats td{text-align:center;padding:4px 2px;font-weight:600;border-bottom:1px solid rgba(42,51,71,.5)}
  table.stats td.pname{text-align:left;font-weight:700;white-space:nowrap;color:var(--accent2)}

  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:11px;color:var(--text)}
  .chip.rule{border-color:#3a4d6b;color:var(--accent2)}

  .opt{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 10px;margin-bottom:7px}
  .opt-l{font-size:11px;color:var(--muted);margin-bottom:5px;line-height:1.3}
  .opt-mode{display:inline-block;font-size:8px;letter-spacing:.08em;text-transform:uppercase;background:#243049;color:var(--accent2);padding:1px 5px;border-radius:4px;margin-left:4px;vertical-align:middle}
  .choice{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:2px 0}
  .choice .nm{font-weight:600}
  .choice .pt{flex:none;font-weight:800;color:var(--gold)}
  .choice .pt.free{color:var(--green)}
  .choice .note{display:block;font-size:10px;color:var(--muted);font-weight:400}
  .opt.consul{border-color:var(--gold)}
  .opt.consul .opt-l{color:var(--gold);font-weight:700}
  .cx-rules{font-size:10px;color:var(--accent2);margin-top:1px}

  .psy{border:1px solid #4a3d6b;border-radius:10px;padding:10px;background:#1a1726}
  .psy h4{font-size:13px;color:#b79cff;margin-bottom:4px}
  .psy .pw{font-size:12px;margin:6px 0}
  .psy .pw b{color:#cbb8ff}
  .psy .pw .prof{font-family:monospace;font-size:11px;color:var(--accent2)}
  .psy .pw .tx{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.35}

  .note-src{font-size:11px;color:var(--muted);font-style:italic;margin-top:6px;line-height:1.35}

  .refwrap{position:fixed;inset:0;background:var(--overlay);z-index:60;display:none;overflow-y:auto;padding:16px 12px 60px}
  .refwrap.show{display:block}
  .refsheet{max-width:520px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px}
  table.ref{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
  table.ref th,table.ref td{border:1px solid var(--border);padding:4px;text-align:center}
  table.ref th{background:#243049;color:var(--accent2);font-weight:700}
  table.ref td.h{background:#1c2333;color:var(--muted);font-weight:700}

  .err{padding:30px 16px;color:var(--red);font-size:14px;text-align:center;grid-column:1/-1}
</style>
</head>
<body>
<header>
  <div>
    <h1>VI Legio Astartes · Space Wolves</h1>
    <h2>Roster · catalog viewer</h2>
  </div>
  <button class="tools-btn" onclick="openRef()">Tabele</button>
</header>

<div class="grid" id="grid"></div>

<div class="overlay" id="overlay" onclick="closeOverlay()"><div class="sheet" id="sheet" onclick="event.stopPropagation()"></div></div>
<div class="refwrap" id="refwrap" onclick="closeRef()"><div class="refsheet" onclick="event.stopPropagation()" id="refsheet"></div></div>

<script src="heresy-units.js"></script>
<script>
const ROLES={HQ:{l:'HQ',r:'\u2620'},EL:{l:'Elites',r:'\u2726'},TR:{l:'Troops',r:'\u2B22'},FA:{l:'Fast Attack',r:'\u27A4'},HS:{l:'Heavy Support',r:'\u25A3'},DT:{l:'Transport',r:'\u25A4'},LO:{l:'Lord of War',r:'\u2739'},PR:{l:'Primarch',r:'\u2739'}};
const MINI=['M','WS','BS','S','T','W','Sv','Inv'];
const UNITS=(typeof HERESY_UNITS!=='undefined')?HERESY_UNITS:[];
const PSY=(typeof HERESY_PSYCHIC!=='undefined')?HERESY_PSYCHIC:{};

function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function ptsHtml(c){const per=c.costMode==='per-model'?' /model':(c.costMode==='per-each'?' /szt':'');
  if(c.free||c.cost===0) return '<span class="pt free">Free'+per+'</span>';
  return '<span class="pt">+'+c.cost+per+'</span>';}

function buildGrid(){
  const g=document.getElementById('grid');
  if(!UNITS.length){g.innerHTML='<div class="err">Nie znaleziono heresy-units.js<br>Umie\u015b\u0107 plik danych obok tego HTML.</div>';return;}
  g.innerHTML=UNITS.map((u,i)=>{
    const p=u.profiles[0]||{};
    const mini=MINI.map(k=>{let v=p[k];if(v==null)v='\u2014';return '<div><div class="k">'+k+'</div><div class="v">'+esc(v)+'</div></div>';}).join('');
    const role=ROLES[u.slot]||{l:u.slot,r:'\u2022'};
    return '<div class="card" data-rune="'+role.r+'" onclick="openUnit('+i+')">'+
      '<div class="card-cost">'+u.baseCost+'</div>'+
      '<div class="card-role">'+role.l+'</div>'+
      '<div class="card-name">'+esc(u.name)+'</div>'+
      '<div class="mini">'+mini+'</div></div>';
  }).join('');
}

function statTable(u){
  const cols=(u.profileType==='vehicle')?['M','BS','front','side','rear','hp']:['M','WS','BS','S','T','W','I','A','Ld','Sv','Inv'];
  const lbl={front:'Fr',side:'Sd',rear:'Rr',hp:'HP'};
  const head='<th></th>'+cols.map(c=>'<th>'+(lbl[c]||c)+'</th>').join('');
  const rows=u.profiles.map(p=>'<tr><td class="pname">'+esc(p.name)+'</td>'+cols.map(c=>'<td>'+esc(p[c]!=null?p[c]:'\u2014')+'</td>').join('')+'</tr>').join('');
  return '<table class="stats"><tr>'+head+'</tr>'+rows+'</table>';
}

function optBlock(o){
  const isC=o.mode==='consul';
  const choices=o.choices.map(c=>{
    let extra='';
    if(c.addsRules)extra+='<div class="cx-rules">+ '+c.addsRules.map(esc).join(', ')+'</div>';
    if(c.grantsWargear)extra+='<div class="cx-rules">\u2694 '+c.grantsWargear.map(esc).join(', ')+'</div>';
    if(c.statMods)extra+='<div class="cx-rules">\u25B3 '+Object.entries(c.statMods).map(e=>e[0]+' '+e[1]).join(', ')+'</div>';
    if(c.note)extra+='<span class="note">'+esc(c.note)+'</span>';
    return '<div class="choice"><span class="nm">'+esc(c.name)+extra+'</span>'+ptsHtml(c)+'</div>';
  }).join('');
  return '<div class="opt'+(isC?' consul':'')+'">'+
    '<div class="opt-l">'+esc(o.label)+'<span class="opt-mode">'+esc(o.mode)+(o.ratio?(' '+o.ratio.count+'/'+o.ratio.per):'')+'</span></div>'+
    choices+(o.note?'<div class="note-src">'+esc(o.note)+'</div>':'')+'</div>';
}

function psyBlock(disc){
  const d=PSY[disc];if(!d)return '';
  let h='<div class="psy"><h4>Psychic \u2014 '+esc(d.name)+'</h4>';
  if(d.note)h+='<div class="note-src">'+esc(d.note)+'</div>';
  (d.weapons||[]).forEach(w=>h+='<div class="pw"><b>'+esc(w.name)+'</b> ('+esc(w.kind)+')<span class="prof"> '+esc(w.profile)+'</span></div>');
  (d.powers||[]).forEach(p=>h+='<div class="pw"><b>'+esc(p.name)+'</b> ('+esc(p.kind)+')<span class="tx">'+esc(p.text)+'</span></div>');
  (d.rules||[]).forEach(r=>h+='<div class="pw"><b>'+esc(r.name)+'</b><span class="tx">'+esc(r.text)+'</span></div>');
  return h+'</div>';
}

function openUnit(i){
  const u=UNITS[i];const role=ROLES[u.slot]||{l:u.slot};
  let h='<div class="oh"><div><div class="role">'+role.l+'</div><h3>'+esc(u.name)+'</h3></div><div class="cost">'+u.baseCost+' pts</div></div>';
  h+='<div class="sec"><div class="sec-t">Profile</div>'+statTable(u)+'</div>';
  if(u.wargear&&u.wargear.length)h+='<div class="sec"><div class="sec-t">Wargear</div><div class="chips">'+u.wargear.map(w=>'<span class="chip">'+esc(w)+'</span>').join('')+'</div></div>';
  if(u.unitType&&u.unitType.length)h+='<div class="sec"><div class="sec-t">Unit Type</div><div class="chips">'+u.unitType.map(w=>'<span class="chip">'+esc(w)+'</span>').join('')+'</div></div>';
  if(u.rules&&u.rules.length)h+='<div class="sec"><div class="sec-t">Special Rules</div><div class="chips">'+u.rules.map(w=>'<span class="chip rule">'+esc(w)+'</span>').join('')+'</div></div>';
  if(u.rulesText&&u.rulesText.length)h+='<div class="sec">'+u.rulesText.map(r=>'<div class="pw"><b>'+esc(r.name)+'</b><span class="tx">'+esc(r.text)+'</span></div>').join('')+'</div>';
  if(u.options&&u.options.length)h+='<div class="sec"><div class="sec-t">Options</div>'+u.options.map(optBlock).join('')+'</div>';
  const discs=[...new Set(u.options.flatMap(o=>o.choices).map(c=>c.discipline).filter(Boolean))];
  if(discs.length)h+='<div class="sec"><div class="sec-t">Psychic Disciplines</div>'+discs.map(psyBlock).join('')+'</div>';
  if(u.transportNote)h+='<div class="note-src">\uD83D\uDE9A '+esc(u.transportNote)+'</div>';
  document.getElementById('sheet').innerHTML=h;
  const ov=document.getElementById('overlay');ov.classList.add('show');ov.scrollTop=0;
}
function closeOverlay(){document.getElementById('overlay').classList.remove('show');}

function toHit(a,t){if(a>t)return '3+';if(t>=2*a)return '5+';return '4+';}
function toWound(s,t){const d=s-t;if(d>=2)return'2+';if(d===1)return'3+';if(d===0)return'4+';if(d===-1)return'5+';return '6+';}
function refTable(title,fn,rowLbl,colLbl){
  let h='<div class="sec-t" style="margin-top:14px">'+title+'</div><table class="ref"><tr><th>'+rowLbl+'\\'+colLbl+'</th>';
  for(let c=1;c<=10;c++)h+='<th>'+c+'</th>';
  h+='</tr>';
  for(let r=1;r<=10;r++){h+='<tr><td class="h">'+r+'</td>';for(let c=1;c<=10;c++)h+='<td>'+fn(r,c)+'</td>';h+='</tr>';}
  return h+'</table>';
}
function openRef(){
  let h='<div class="oh"><div><div class="role">Reference</div><h3>To Hit / To Wound</h3></div></div>';
  h+='<div class="note-src">To Hit (melee): wiersz = WS atakuj\u0105cego, kolumna = WS celu. Ranged = trafiasz na warto\u015b\u0107 BS.</div>';
  h+=refTable('To Hit \u2014 melee (WS vs WS)',toHit,'A','D');
  h+='<div class="note-src" style="margin-top:12px">To Wound: wiersz = Strength, kolumna = Toughness.</div>';
  h+=refTable('To Wound (S vs T)',toWound,'S','T');
  document.getElementById('refsheet').innerHTML=h;
  const rw=document.getElementById('refwrap');rw.classList.add('show');rw.scrollTop=0;
}
function closeRef(){document.getElementById('refwrap').classList.remove('show');}

buildGrid();
</script>
</body>
</html>
